<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualizando Bingoelus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #090909;
      --surface: #151515;
      --surface2: #222017;
      --accent: #e7ad18;
      --accent-h: #ffd765;
      --text: #fbf7ea;
      --muted: #b1a47e;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -20%, rgba(231, 173, 24, .22), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border: 1px solid rgba(231, 173, 24, .28);
      -webkit-app-region: drag;
    }

    .upd-card {
      width: 100%;
      background: linear-gradient(155deg, rgba(28, 25, 16, .96), rgba(15, 15, 15, .98));
      border: 1px solid rgba(231, 173, 24, .32);
      border-radius: 16px;
      padding: 24px 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .55), inset 0 1px rgba(255, 255, 255, .04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .upd-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .upd-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(231, 173, 24, .35));
    }

    h1 {
      font-size: 1.15rem;
      letter-spacing: .04em;
      color: var(--accent-h);
      font-weight: 800;
    }

    #upd-version {
      display: inline-block;
      font-size: .78rem;
      font-weight: 700;
      color: #090909;
      background: linear-gradient(135deg, var(--accent-h), var(--accent));
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: .04em;
    }

    #upd-mensaje {
      font-size: .9rem;
      color: var(--text);
      min-height: 1.3em;
    }

    .upd-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid rgba(231, 173, 24, .22);
      overflow: hidden;
    }

    #upd-barra {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-h));
      box-shadow: 0 0 12px rgba(231, 173, 24, .45);
      transition: width .22s ease;
    }

    .upd-stats {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: .78rem;
      color: var(--muted);
    }

    #upd-porcentaje {
      color: var(--accent-h);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    #upd-detalle {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .upd-nota {
      font-size: .76rem;
      color: var(--muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <main class="upd-card" role="status" aria-live="polite">
    <div class="upd-head">
      <img class="upd-logo" src="/media/bingoelus.png" alt="Bingoelus" />
      <h1>Actualizando Bingoelus</h1>
      <span id="upd-version">Nueva versión disponible</span>
    </div>

    <p id="upd-mensaje">Preparando descarga...</p>

    <div class="upd-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="upd-progress-track">
      <div id="upd-barra"></div>
    </div>

    <div class="upd-stats">
      <span id="upd-detalle">Conectando con GitHub Releases...</span>
      <span id="upd-porcentaje">0 %</span>
    </div>

    <p class="upd-nota">La aplicación se reiniciará automáticamente al terminar.</p>
  </main>

  <script>
    'use strict';
    const versionEl = document.getElementById('upd-version');
    const mensajeEl = document.getElementById('upd-mensaje');
    const barraEl = document.getElementById('upd-barra');
    const trackEl = document.getElementById('upd-progress-track');
    const pctEl = document.getElementById('upd-porcentaje');
    const detalleEl = document.getElementById('upd-detalle');

    function aplicarEstado(estado) {
      if (!estado || typeof estado !== 'object') return;
      if (estado.version) {
        versionEl.textContent = `Versión ${estado.version}`;
      }
      if (estado.mensaje) {
        mensajeEl.textContent = estado.mensaje;
      }
      if (Number.isFinite(estado.porcentaje)) {
        const pct = Math.max(0, Math.min(100, Math.round(estado.porcentaje)));
        barraEl.style.width = `${pct}%`;
        pctEl.textContent = `${pct} %`;
        trackEl.setAttribute('aria-valuenow', String(pct));
      }
      if (estado.detalle) {
        detalleEl.textContent = estado.detalle;
      }
    }

    if (window.bingoelusUpdater && typeof window.bingoelusUpdater.onEstado === 'function') {
      window.bingoelusUpdater.onEstado(aplicarEstado);
    }
  </script>
</body>
</html>
